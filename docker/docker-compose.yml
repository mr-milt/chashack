# docker-compose for codecats.
#
#   client - the React (Vite) frontend      -> dockerfile.react
#   proxy  - nginx reverse proxy + TLS      -> nginx.conf.docker
#
# Run from the docker/ directory:
#   docker compose up -d --build

services:
  client:
    build:
      context: ..
      dockerfile: docker/dockerfile.react
    container_name: codecats-react
    ports:
      - "5173:5173"
    volumes:
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    container_name: codecats-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf.docker:/etc/nginx/conf.d/default.conf:ro
      - /var/www/certbot:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - client
    restart: unless-stopped